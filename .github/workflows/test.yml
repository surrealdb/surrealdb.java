name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  format:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust (with rustfmt)
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          components: rustfmt

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Check Java formatting
        run: |
          chmod +x gradlew
          ./gradlew spotlessJavaCheck

  build:
    name: Test (Java ${{ matrix.java }}, SurrealDB ${{ matrix.surrealdb }})
    runs-on: ubuntu-latest
    # Nightly is an early warning, not a merge gate: a server regression there
    # should not block unrelated PRs.
    continue-on-error: ${{ matrix.surrealdb == 'nightly' }}

    strategy:
      fail-fast: false
      matrix:
        java: [ '8', '11', '17', '21', '25' ]
        # Latest 3.x server release. Bump when a new 3.x lands.
        surrealdb: [ 'v3.3.4' ]
        include:
          # The server version matching the embedded crate (Cargo.toml).
          - java: '17'
            surrealdb: 'v3.1.5'
          # Tip of the server's main branch.
          - java: '17'
            surrealdb: 'nightly'

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2

      - name: Install dependencies
        run: sudo apt-get update

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}

      - name: Build native lib
        run: cargo build

      - name: Start SurrealDB
        id: surrealdb
        uses: surrealdb/setup-surreal@5795ce3773d2fec644ef5ce6b549f4872d4b33be # v3.0.0
        with:
          surrealdb_version: ${{ matrix.surrealdb }}
          surrealdb_port: 8000
          surrealdb_auth: false
          surrealdb_strict: false
          surrealdb_log: info
          surrealdb_additional_args: --allow-all
          surrealdb_retry_count: 30

      - name: Test
        env:
          SURREALDB_URL: ws://localhost:8000
        run: |
          echo "Testing against SurrealDB ${{ steps.surrealdb.outputs.version }}"
          chmod +x gradlew
          ./gradlew -i test recordTest jacocoTestReport
