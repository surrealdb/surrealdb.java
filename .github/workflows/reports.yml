name: Reports

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required by the Deploy step (peaceiris/actions-gh-pages) on main

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install dependencies
        run: sudo apt-get update

      - name: Install Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2

      - name: Set up JDK
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: 'temurin'
          java-version: 25

      - name: Build native lib
        run: cargo build

      - name: Setup Gradle
        run: chmod +x gradlew

      - name: Start SurrealDB
        uses: ./.github/actions/start-surrealdb
        with:
          version: v4.0.0

      - name: Clean
        run: ./gradlew -i clean

      - name: Test & Coverage
        run: ./gradlew -i test jacocoTestReport

      - name: Javadoc
        run: ./gradlew -i javadoc

      - name: Report
        run: ./gradlew -i clean createCombinedReport

      - name: Deploy
        uses: peaceiris/actions-gh-pages@e9c66a37f080288a11235e32cbe2dc5fb3a679cc # v4
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/reports
